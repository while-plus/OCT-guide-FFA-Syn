#####
name: CycleGan
bidirect: False   #Unidirectional or bidirectional
regist: True      # With or without registration network
noise_level: 0    #  noise level
port: 6019        #  port parameters

save_root: './outputs'
train_csv: './data/samples.csv'
test_csv: './data/samples.csv'
data_dir: './data'

# lamda weight
Adv_lamda: 1      
Cyc_lamda: 10     
Corr_lamda: 20     
Smooth_lamda: 10   
OCT_lambda: 10
CLIP_lamda: 0.1

epoch: 0                      # starting epoch
n_epochs: 160                 # How often do you want to display output images during training
decay_epoch: 40               # epoch to start linearly decaying the learning rate to 0

batchSize: 4                  # size of the batches
lr: 0.00001                   # initial learning rate

size: 512                     # size of the data crop
input_nc: 3    
output_nc: 1                  
cuda: True                
n_cpu: 1

